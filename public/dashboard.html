<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SmartBill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">SmartBill</a>
            <button class="btn btn-outline-light" id="logout-button">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Sidebar / Settings -->
            <div class="col-md-4">
                <!-- Profile Setup -->
                <div class="card mb-4">
                    <div class="card-header">
                        My Profile
                    </div>
                    <div class="card-body">
                        <form id="profile-setup-form">
                            <div class="mb-3">
                                <label class="form-label">Company Name</label>
                                <input type="text" class="form-control" name="company_name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Company Address</label>
                                <textarea class="form-control" name="company_address" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Short Form (for Invoice #)</label>
                                <input type="text" class="form-control" name="short_form" placeholder="e.g. ACME" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Save Profile</button>
                        </form>
                    </div>
                </div>

                <!-- Create Client -->
                <div class="card mb-4">
                    <div class="card-header">
                        Add New Client
                    </div>
                    <div class="card-body">
                        <form id="create-client-form">
                            <div class="mb-3">
                                <label class="form-label">Client Name</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Client Address</label>
                                <textarea class="form-control" name="address" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Short Form</label>
                                <input type="text" class="form-control" name="short_form" placeholder="e.g. CLI" required>
                            </div>
                            <button type="submit" class="btn btn-success">Add Client</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Main Content / Invoice Generator -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        Create New Invoice
                    </div>
                    <div class="card-body">
                        <form id="invoice-form">
                            <div class="mb-3">
                                <label class="form-label">Select Client</label>
                                <select class="form-select" id="client-select-dropdown" required>
                                    <option value="">Choose...</option>
                                </select>
                            </div>

                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>Description</th>
                                        <th style="width: 100px;">Qty</th>
                                        <th style="width: 120px;">Rate</th>
                                        <th>Total</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="invoice-items-table-body">
                                    <!-- Items will be added here -->
                                </tbody>
                            </table>
                            <button type="button" class="btn btn-secondary mb-3" id="add-invoice-item-btn">Add Item</button>

                            <div class="row justify-content-end">
                                <div class="col-md-6">
                                    <table class="table table-sm">
                                        <tr>
                                            <td>Subtotal:</td>
                                            <td class="text-end" id="subtotal">0.00</td>
                                        </tr>
                                        <tr>
                                            <td>
                                                Tax Rate (%):
                                                <input type="number" class="form-control d-inline-block" style="width: 80px" id="tax-rate" value="0" min="0">
                                            </td>
                                            <td class="text-end align-middle" id="tax-amount">0.00</td>
                                        </tr>
                                        <tr>
                                            <th>Total:</th>
                                            <th class="text-end" id="total-amount">0.00</th>
                                        </tr>
                                    </table>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Generate Invoice</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="invoice-success-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Invoice Created</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>The invoice has been successfully created.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <a href="#" class="btn btn-primary" id="invoice-download-link" target="_blank">Download PDF</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
