<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SmartBill</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100">
    <nav class="bg-gray-800 text-white mb-8">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a class="text-xl font-bold" href="#">SmartBill</a>
            <button class="border border-white hover:bg-white hover:text-gray-800 px-3 py-1 rounded transition" id="logout-button">Logout</button>
        </div>
    </nav>

    <div class="container mx-auto px-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Sidebar / Settings -->
            <div class="md:col-span-1 space-y-6">
                <!-- Profile Setup -->
                <div class="bg-white shadow rounded-lg overflow-hidden">
                    <div class="bg-gray-100 px-4 py-3 border-b border-gray-200 font-bold">
                        My Profile
                    </div>
                    <div class="p-4">
                        <form id="profile-setup-form">
                            <div class="mb-3">
                                <label class="block text-gray-700 text-sm font-bold mb-2">Company Name</label>
                                <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="company_name" required>
                            </div>
                            <div class="mb-3">
                                <label class="block text-gray-700 text-sm font-bold mb-2">Company Address</label>
                                <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="company_address" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="block text-gray-700 text-sm font-bold mb-2">Short Form (for Invoice #)</label>
                                <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="short_form" placeholder="e.g. ACME" required>
                            </div>
                            <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Save Profile</button>
                        </form>
                    </div>
                </div>

                <!-- Create Client -->
                <div class="bg-white shadow rounded-lg overflow-hidden">
                    <div class="bg-gray-100 px-4 py-3 border-b border-gray-200 font-bold">
                        Add New Client
                    </div>
                    <div class="p-4">
                        <form id="create-client-form">
                            <div class="mb-3">
                                <label class="block text-gray-700 text-sm font-bold mb-2">Client Name</label>
                                <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label class="block text-gray-700 text-sm font-bold mb-2">Client Address</label>
                                <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="address" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="block text-gray-700 text-sm font-bold mb-2">Short Form</label>
                                <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="short_form" placeholder="e.g. CLI" required>
                            </div>
                            <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Add Client</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Main Content / Invoice Generator -->
            <div class="md:col-span-2">
                <div class="bg-white shadow rounded-lg overflow-hidden">
                    <div class="bg-gray-100 px-4 py-3 border-b border-gray-200 font-bold">
                        Create New Invoice
                    </div>
                    <div class="p-4">
                        <form id="invoice-form">
                            <div class="mb-3">
                                <label class="block text-gray-700 text-sm font-bold mb-2">Select Client</label>
                                <select class="shadow border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-white" id="client-select-dropdown" required>
                                    <option value="">Choose...</option>
                                </select>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-200 mb-4 border border-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-24">Qty</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-32">Rate</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
                                            <th class="px-3 py-2"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="invoice-items-table-body" class="bg-white divide-y divide-gray-200">
                                        <!-- Items will be added here -->
                                    </tbody>
                                </table>
                            </div>
                            <button type="button" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-1 px-3 rounded text-sm mb-4" id="add-invoice-item-btn">Add Item</button>

                            <div class="flex justify-end">
                                <div class="w-full md:w-1/2">
                                    <table class="min-w-full">
                                        <tr>
                                            <td class="px-2 py-1 text-right font-semibold">Subtotal:</td>
                                            <td class="px-2 py-1 text-right" id="subtotal">0.00</td>
                                        </tr>
                                        <tr>
                                            <td class="px-2 py-1 text-right font-semibold">
                                                Tax Rate (%):
                                            </td>
                                            <td class="px-2 py-1 text-right">
                                                <input type="number" class="shadow appearance-none border rounded w-20 py-1 px-2 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-right" id="tax-rate" value="0" min="0">
                                            </td>
                                        </tr>
                                         <tr>
                                            <td class="px-2 py-1 text-right font-semibold">Tax Amount:</td>
                                            <td class="px-2 py-1 text-right" id="tax-amount">0.00</td>
                                        </tr>
                                        <tr>
                                            <th class="px-2 py-1 text-right text-lg">Total:</th>
                                            <th class="px-2 py-1 text-right text-lg" id="total-amount">0.00</th>
                                        </tr>
                                    </table>
                                </div>
                            </div>

                            <div class="mt-6">
                                <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded text-lg focus:outline-none focus:shadow-outline">Generate Invoice</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="invoice-success-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">Invoice Created</h3>
                <div class="mt-2 px-7 py-3">
                    <p class="text-sm text-gray-500">The invoice has been successfully created.</p>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="close-modal-btn" class="px-4 py-2 bg-gray-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-300 mb-2">
                        Close
                    </button>
                    <a href="#" class="block w-full px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md shadow-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-300" id="invoice-download-link" target="_blank">
                        Download PDF
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
